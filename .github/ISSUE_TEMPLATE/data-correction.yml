name: Data Correction
description: Report an inaccurate or outdated station, line, or metro attribute
title: "[Data Correction]: "
labels: ["data-correction"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping keep the Indian Metro Network Tracker accurate and up to date!
        Please ensure all suggested corrections are backed by official transit operator citations or government records.
  - type: input
    id: source_link
    attributes:
      label: Source Link
      description: URL to an official operator webpage, official press release, or verified government gazette supporting this correction.
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: correction_details
    attributes:
      label: What is incorrect?
      description: Describe the inaccuracy and provide the correct details (e.g., station name typo, revised opening date, line alignment, status change).
      placeholder: "e.g., Station name is misspelled as X instead of Y / Section was inaugurated on 2024-03-06"
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: Prefilled Feature Diagnostics
      description: Feature metadata generated by the app (type, ID, name, city, timestamps, and map permalink).
    validations:
      required: false
  - type: textarea
    id: additional_notes
    attributes:
      label: Additional Notes & Context
      description: Any extra context, local transit notes, or details.
    validations:
      required: false
